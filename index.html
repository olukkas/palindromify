<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindromify | O SaaS que o mercado precisa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="text-center mb-8">
        <span
            class="bg-indigo-100 text-indigo-600 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase">Enterprise
            Ready</span>
        <h1 class="text-5xl font-extrabold mt-4 tracking-tight">Palindrom<span class="text-indigo-600">ify</span></h1>
        <p class="text-slate-500 mt-2 text-lg">Resolvendo a dor de 6 em cada 6 candidatos com IA (Inteligência
            Artesanal).</p>
    </div>

    <div
        class="glass border border-white shadow-2xl rounded-3xl p-8 w-full max-w-md transition-all hover:shadow-indigo-100">
        <form id="palindrome-form" onsubmit="event.preventDefault(); checkPalindrome()">
            <label for="text-input" class="block text-sm font-semibold text-slate-700 mb-2">Sua string
                estratégica</label>
            <input type="text" id="text-input" placeholder="Ex: Anotaram a data da maratona"
                class="w-full px-4 py-4 rounded-xl border border-slate-200 focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all text-lg mb-6">

            <button submit onclick="checkPalindrome()"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition-all transform active:scale-[0.98] shadow-lg shadow-indigo-200">
                Analisar Viabilidade
            </button>
        </form>
        <div id="result" class="mt-8 hidden animate-in fade-in duration-500">
            <div id="status-card" class="p-4 rounded-2xl flex items-center justify-center gap-3">
                <span id="status-icon" class="text-2xl"></span>
                <p id="status-text" class="font-bold text-lg"></p>
            </div>
            <p id="details" class="text-center text-sm text-slate-400 mt-4 italic"></p>
        </div>
    </div>

    <footer class="mt-12 text-slate-400 text-xs">
        &copy; 2026 Palindromify Inc. - "Escalando soluções simples para problemas que deveriam ser triviais."
    </footer>

    <script>
        function checkPalindrome() {
            const input = document.getElementById('text-input').value;
            const resultDiv = document.getElementById('result');
            const statusCard = document.getElementById('status-card');
            const statusText = document.getElementById('status-text');
            const statusIcon = document.getElementById('status-icon');
            const details = document.getElementById('details');

            if (!input.trim()) return;

            const cleanStr = input.toLowerCase().replace(/[^a-z0-9]/g, '');
            const reversedStr = cleanStr.split('').reverse().join('');
            const isPalindrome = cleanStr === reversedStr && cleanStr.length > 0;

            resultDiv.classList.remove('hidden');

            if (isPalindrome) {
                statusCard.className = "p-4 rounded-2xl flex items-center justify-center gap-3 bg-emerald-50 text-emerald-700 border border-emerald-100";
                statusText.innerText = "É um Palíndromo!";
                statusIcon.innerText = "✅";
                details.innerText = "Sua string é simétrica. O mercado está a salvo.";
            } else {
                statusCard.className = "p-4 rounded-2xl flex items-center justify-center gap-3 bg-rose-50 text-rose-700 border border-rose-100";
                statusText.innerText = "Não é Palíndromo";
                statusIcon.innerText = "❌";
                details.innerText = "Infelizmente esta string não tem o ROI de simetria necessário.";
            }

            setTimeout(clearAll, 3000)
        }

        function clearAll() {
            const inputElement = document.getElementById('text-input');
            const resultDiv = document.getElementById('result');
            const resetBtn = document.getElementById('reset-btn');

            inputElement.value = '';
            resultDiv.classList.add('hidden');
            if (resetBtn) resetBtn.remove();
            inputElement.focus();
        }
    </script>
</body>

</html>
